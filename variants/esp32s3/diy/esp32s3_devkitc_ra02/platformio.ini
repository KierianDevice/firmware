; ESP32-S3-DevKitC-1 clone (N8R8/N16R8, octal PSRAM) + Ai-Thinker Ra-02 (SX1278, 433 MHz)
[env:esp32s3-devkitc-ra02]
extends = esp32s3_base
board = esp32s3-devkitc-ra02
board_level = extra
board_build.partitions = partition-table-t3s3.csv
upload_protocol = esptool
build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/esp32s3_devkitc_ra02
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_433
